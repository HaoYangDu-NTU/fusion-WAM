# The benchmark supplies official seed/settle/camera/action rules from policy_config.yml.
server:
  url: ws://127.0.0.1:8940
  timeout: 300
render: gpu
output_dir: outputs/vla_harness/libero
benchmarks:
  - benchmark: benchmarks.vla_harness.libero:OpenWAMLIBEROBenchmark
    name: OpenWAMLIBERO
    mode: sync
    recording:
      record_step: false
      record_video: false
    episodes_per_task: 50
    params:
      suites: [libero_spatial, libero_object, libero_goal, libero_10]
