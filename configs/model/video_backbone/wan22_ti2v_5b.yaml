# Wan2.2-TI2V-5B video backbone (cfg.model.video_backbone.*). Supports an
# external encoder + from_scratch; any H,W % 32 == 0.

defaults:
  - encoder: wan22_vae   # used only when from_scratch=true; wan22_vae | flux2_vae | dinov3 | vjepa21
  - _self_

name: wan22_ti2v_5b
model_path: /path/to/Wan2.2-TI2V-5B  # [Required] weights dir
text_encoder_type: umt5-xxl  # umt5-xxl | cosmos3-nano | qwen3p5-4b | cosmos3-edge | rynnbrain1p1-2b | rynnbrain1p1-9b
vlm_text_embedding_method: avg_all_layers  # avg_all_layers | last_layer | concat_all_layers
text_embedding_dir: null  # null selects data/<encoder>-embedding/libero[/<method>]

text_embedding_fingerprint: null  # pinned from cache when saving the checkpoint

from_scratch: false   # true = re-init the DiT from scratch (video encoder frozen; text uses offline cache)
shift_video: 5.0      # flow-matching α-shift for the video scheduler (train + deploy single source of truth)
