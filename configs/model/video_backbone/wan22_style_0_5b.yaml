# Video predictor for the 0.6B policy (paired with a 0.1B action expert).
# Same Wan2.2 layers, conditioning and attention head dimension as the baseline.
defaults:
  - wan22_ti2v_5b
  - _self_

name: wan22_style_0_5b
from_scratch: true

# 493,862,912 predictor parameters with raw V-JEPA-L features / grid (1,2,2).
# The 0.6B dev launcher sets action dim=320 / ffn_dim=1280 (105,937,040 params).
dit_config:
  dim: 1024
  ffn_dim: 3584
  num_heads: 8
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-6
  has_image_input: false
  seperated_timestep: true
  require_vae_embedding: false
  require_clip_embedding: false
  fuse_vae_embedding_in_latents: true
