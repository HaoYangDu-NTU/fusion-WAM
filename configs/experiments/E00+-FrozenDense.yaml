id: E00+-FrozenDense
name: m29_rynn9b_vjepa21_e00plus_frozen_dense
base_experiment: E00
# Dense visual readout from the frozen E00 representation, with FP32 gate and
# residual accumulation. Sparsity regularization stays disabled.
action_router:
  enabled: true
  dim: 512
  num_heads: 8
  top_k: 32
  gate_init: 0.01
  fp32_gate: true
  fp32_residual: true
  sparse_weight: 0.0
  warmup_steps: 0
  ramp_steps: 0
